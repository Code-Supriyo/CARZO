<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARZO - Purchase History</title>
    <link rel="stylesheet" href="css/carzo.css">
</head>

<body>
    <!-- Navigation Bar -->
    <header class="home-navbar">

        <div class="home-logo">
            <a href="Home.html">CARZO</a>
        </div>

        <div class="home-nav-right">
            <a href="Home.html">Home</a>
            <a href="Profile">My Profile</a>
            <a href="Logout">Logout</a>
        </div>
    </header>

    <!-- Purchase History Section -->
    <main>
        <section class="purchase-history">
            <h1>My Purchase History</h1>
            <p>View all your previous car bookings and purchases.</p>
            <table>
                <thead>
                    <tr>
                        <th>Purchase ID</th>
                        <th>Car Name</th>
                        <th>Brand</th>
                        <th>Price</th>
                        <th>Purchase Date</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td colspan="6">
                            Your purchase history will appear here.
                        </td>
                    </tr>
                </tbody>
            </table>
            <a href="Home.html">Back to Home</a>
        </section>
    </main>

</body>
</html>
