
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Change Password - CARZO</title>
 <link rel="stylesheet" href="css/carzo.css?v=2"></head>

<body>

    <h2>Change Password</h2>

    <p id="message"></p>

    <p>
        If you came here through Forgot Password,
        leave Current Password blank.
    </p>

    <form action="ChangePassword" method="post">

        <label>Current Password:</label><br>

        <input type="password"
               id="currentPassword"
               name="currentPassword">

        <button type="button"
                onclick="togglePassword('currentPassword', this)">👁</button>

        <br><br>

        <label>New Password:</label><br>

        <input type="password"
               id="newPassword"
               name="newPassword"
               required>

        <button type="button"
                onclick="togglePassword('newPassword', this)">👁</button>

        <br><br>

        <label>Confirm New Password:</label><br>

        <input type="password"
               id="confirmPassword"
               name="confirmPassword"
               required>

        <br><br>

        <button type="submit">Update Password</button>

    </form>

    <p><a href="Login.html">Back to Login</a></p>

    <script>

        // Show and Hide Password
        function togglePassword(id, button) {

            const password = document.getElementById(id);

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "🙈";
            } else {
                password.type = "password";
                button.textContent = "👁";
            }
        }

        // Success and Failed Message
        const params = new URLSearchParams(window.location.search);
        const status = params.get("status");

        const message = document.getElementById("message");

        if (status === "success") {

            message.textContent = "Password Changed Successfully!";
            message.style.color = "green";

            // Clear all password fields
            document.querySelector("form").reset();

            // Automatically reload after 3 seconds
            setTimeout(function() {
                window.location.replace("ChangePassword.html");
            }, 3000);

        }

        else if (status === "failed") {

            message.textContent = "Password Change Failed! Please try again.";
            message.style.color = "red";

        }

    </script>

</body>
</html>
