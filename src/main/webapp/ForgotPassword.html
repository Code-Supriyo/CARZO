<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - VAHAN</title>
</head>
<body>

    <h2>Forgot Password</h2>

    <form action="ForgotPassword" method="post">

        <label>Registered Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Security Question:</label><br>
        <select name="question" required>
            <option value="">Select Security Question</option>
            <option value="Dream Car">What is your dream car?</option>
            <option value="Favorite Color">What is your favorite color?</option>
        </select><br><br>

        <label>Security Answer:</label><br>
        <input type="text" name="answer" required><br><br>

        <button type="submit">Verify</button>

    </form>

    <p><a href="Login.html">Back to Login</a></p>

</body>
</html>
