
<form action="EditProfile" method="post">

    <label>Full Name:</label><br>
    <input type="text" name="name"
           placeholder="Enter new name">
    <br><br>

    <label>Contact Number:</label><br>
    <input type="text" name="contact"
           placeholder="Enter new contact number">
    <br><br>

    <label>Address:</label><br>
    <textarea name="address"
              placeholder="Enter new address"></textarea>
    <br><br>

    <label>Security Question:</label><br>
    <select name="question">
        <option value="">Keep Previous Question</option>
        <option value="Dream Car">What is your dream car?</option>
        <option value="Favorite Color">What is your favorite color?</option>
    </select>
    <br><br>

    <label>Security Answer:</label><br>
    <input type="text" name="answer"
           placeholder="Enter new answer">
    <br><br>

    <label>Do you have any car?</label><br>
    <select name="carStatus">
        <option value="">Keep Previous Status</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select>
    <br><br>

    <label>Car Name / Model:</label><br>
    <input type="text" name="carName"
           placeholder="Enter new car name">
    <br><br>

    <button type="submit">Update Profile</button>

</form>
