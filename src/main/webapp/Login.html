
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CARZO - User Login</title>

 <link rel="stylesheet" href="css/carzo.css?v=2"></head>

<body>

    <div class="form-container">

        <h2>CARZO</h2>
        <p class="form-description">Where Elegance Meets the Road</p>

        <h2>Welcome Back!</h2>
        <p class="form-description">Login to explore your dream car.</p>

        <form method="post" action="Login">

            <div class="form-group">
                <label>Email ID</label>
                <input type="email" name="L1"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>

                <div class="password-wrapper">
                    <input type="password" id="password"
                           name="L2"
                           placeholder="Enter your password" required>

                    <button type="button"
                        onclick="togglePassword('password', this)">👁</button>
                </div>
            </div>

            <div style="text-align:right; margin-bottom:20px;">
                <a href="ForgotPassword.html">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary">
                LOGIN
            </button>

            <button type="reset" class="btn btn-outline">
                RESET
            </button>

        </form>

        <div class="form-footer">
            Don't have an account?
            <a href="SignUp.html">Create Account</a>
        </div>

    </div>

    <script>
        function togglePassword(id, button) {
            const password = document.getElementById(id);

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "🙈";
            } else {
                password.type = "password";
                button.textContent = "👁";
            }
        }
    </script>

</body>
</html>
